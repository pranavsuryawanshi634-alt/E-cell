# =====================================================================
# Render Deployment Blueprint for E-Cell SITRC Platform (100% Free Tier)
# =====================================================================
# This file automates deployment of the backend on Render Free Tier connected
# to your free Neon Serverless PostgreSQL database (zero cost, zero disk fees).
# =====================================================================

services:
  # 1. Backend Web Service
  - type: web
    name: ecell-sitrc-backend
    env: node
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build && npx prisma generate
    startCommand: npm run start
    healthCheckPath: /api/health
    plan: free # 100% Free tier (paired with free Neon PostgreSQL)
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard: your Neon pooled connection string
      - key: DIRECT_URL
        sync: false # Set in Render Dashboard: your Neon direct connection string
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false # Set in Render Dashboard: your live Vercel URL (e.g. https://ecell-sitrc.vercel.app)
      - key: UPLOAD_DIR
        value: uploads
